name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17.3"
          otp-version: "27"
          # Loose matching keeps the OTP 27 major while following the latest
          # available patch on the mirror. Strict matching for "27" fails when
          # the mirror only lists full patch versions such as 27.3.4.15.
          version-type: loose

      - name: Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Unlock unused deps
        run: mix deps.unlock --check-unused

      - name: Build assets
        run: mix assets.build

      - name: Run tests
        run: mix test

      - name: Verify headless replay determinism
        run: mix signal_garden.replay --check-all
